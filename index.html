<!doctype html>
<html>
	<head>
		<meta charset="utf-8">
		<meta http-equiv="X-UA-Compatible" content="IE=edge">
		<link rel="shortcut icon" href="https://getquicker.net/favicon.ico" type="image/x-icon">
		<link rel="icon" href="https://getquicker.net/favicon.ico" type="image/x-icon">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<title>Quicker推送_乐昂岚版</title>
		<style>
			body{width: 50vw;min-width: 380px;margin:1em auto;font-size:1em;}
			.title{font-size:calc(1.3rem + .6vw);font-weight: 500;line-height: 1.2;}
			#setting{
				padding: .25rem .5rem;
				font-size: .875rem;
				border-radius: .2rem;
				color: #0d6efd;
				border-color: #0d6efd;
			}
			#setting_detial{display: block;}
			.btn {
				display: inline-block;
				line-height: 1.5;
				color: #212529;
				text-align: center;
				text-decoration: none;
				vertical-align: middle;
				border: 1px solid transparent;
			}
			#email, #code, #toDevice{width:calc(100% - 14px);padding:2px 6px;margin:0px 0px 16px;border-width: 1px;height:30px;border-radius:.25em;}
			#toDevice {
			    width: calc(100% - 106px);
				border-radius: 0.25em 0 0 0.25em;
				height: 36px;
    			font-size: 1em;
			}
			#get{
				width: 106px;
			    margin: 0px;
			    padding: 2px 0px;
			    height: 36px;
			    border-radius: 0 0.25em 0.25em 0;font-size: 1em;
			    border-width: 1px 1px 1px 0;
			}
			input{font-size: 1em;}
			.wait{
				position: relative;
				display: flex;
				flex-wrap: wrap;
				align-items: stretch;
				width: 100%;
			}
			.wait>div, .wait>span{
				display: flex;
				align-items: center;
				padding: .375rem .75rem;
				font-size: 1rem;
				font-weight: 400;
				line-height: 1.5;
				color: #212529;
				text-align: center;
				white-space: nowrap;
				background-color: #e9ecef;
				border: 1px solid #ced4da;
				border-radius: .25rem;
			}
			input[type=checkbox] {
				border-radius: .5em;
				width: 1.2em;
				height: 1.2em;
			}
			#wait{
				margin-left: -1px;
				flex: 1 1 auto;
				width: 1%;
				min-width: 0;
				padding:0px 6px;
			}
			#wait_time{margin-left: -1px;}
			#fora>.a{
				width: 1%;
				border: 1px solid grey;
				display: table-cell;
			}
			#fora{font-size:0em;line-height:normal;margin:16px 0px;}
			#fora a{font-size:16px;vertical-align:middle;padding:4px 0px;}
			#forbtn>.a{
				margin: 10px 0px;
				width: 1%;
				border: 1px solid grey;
			}
			#actionID{width: calc(100% - 6px);padding:2px;margin:0px 0px 10px 0px;height:30px;}
			#data{width: calc(100% - 6px);padding:2px;margin:0px;font-size: 1.2em;}
			pre{font-family: var(--bs-font-monospace);padding: 1rem !important;margin:0px;}
			#content{border: 1px solid #0000 !important;}
			h3{margin:0.5em 0px;}
			#forbtn>a:nth-child(1){
				width:20%;
			}
			#forbtn>a:nth-child(2){
				color: #fff;
				background-color: #0d6efd;
				border-color: #0d6efd;
				width:36%;
				margin: auto calc(12% - 3px);
			}
			#forbtn>a:nth-child(3){
				color: #fff;
				background-color: #6c757d;
				border-color: #6c757d;
				width:20%;
			}
			#forbtn{font-size:0em;line-height:normal;}
			#forbtn a{font-size:16px;vertical-align:middle;border-radius: .25rem;padding:4px 0px;}
			#actionID, #data{border-radius: .25rem;border: 1px solid grey;}
			#fora a:nth-child(2) {
			    border-width: 1px 0;
			}
			#fora a:nth-child(3) {
			    border-width: 1px 0 1px 1px;
			}
		</style>
	</head>
	<body>
		<div id="all">
			<h3 class="title">推送文本到电脑
                <a class="btn" id="setting" onclick="on_or_off()" aria-expanded="true">连接设置</a>
				<script>
					function on_or_off(){
						if(document.getElementById('setting_detial').style.display=="none"){
							document.getElementById('setting_detial').style.display="block";
						}else{
							document.getElementById('setting_detial').style.display="none";
						}
					}
				</script>
			</h3>
			<div id="setting_detial" class="hide show">
				<div><input type="text" id="email" placeholder="Quicker邮箱"></div>
				<div><input type="text" id="code" placeholder="推送验证码"></div>
				<div style="display: flex;">
					<select id="toDevice">
					  <option value="">活动主机</option>
					  <option value="*">所有主机</option>
					  <option value="host1">具体主机1</option>
					  <option value="host2">具体主机2</option>
					</select>
					<button id="get">获取主机</button>
				</div>
				<div class="wait" style="margin: 0px 0px 16px;">
					<div style="border-radius: .25em;width: 100%;">
						<input type="checkbox" id="txt">
						<label for="txt" >&nbsp;返回结果格式是否为txt&nbsp;(&nbsp;不勾选将返回Json&nbsp;)</label>
					</div>
				</div>
				<div class="wait">
					<div style="border-radius:.25em 0px 0px .25em;">
						<input type="checkbox" id="chkWait">
						<label for="chkWait" >&nbsp;等待返回结果</label>
					</div>
					<input id="wait" type="number">
					<span id="wait_time" style="border-radius:0px .25em .25em 0px;">毫秒</span>
				</div>
			</div>
			<div id="fora">
				<a class="btn a" id="a1" onclick="choice_operation(1)" style="border-radius:6px 0px 0px 6px;margin-left:0px;">粘贴到窗口</a>
				<a class="btn a" id="a2" onclick="choice_operation(2)" >复制</a>
				<a class="btn a" id="a3" onclick="choice_operation(3)" >打开网址</a>
				<a class="btn a" id="a4" onclick="choice_operation(4)" style="border-radius:0px 6px 6px 0px;">运行动作</a>
				<script>
					function choice_operation(which){
						document.getElementById("a1").style.backgroundColor="";document.getElementById("a2").style.backgroundColor="";document.getElementById("a3").style.backgroundColor="";document.getElementById("a4").style.backgroundColor="";
						document.getElementById("a1").style.color="";document.getElementById("a2").style.color="";document.getElementById("a3").style.color="";document.getElementById("a4").style.color="";
						document.getElementById("actionID").style.display="none";
						if(which==1){document.getElementById("data").placeholder="要粘贴的内容";operation="PASTE";document.getElementById("a1").style.backgroundColor="#6c757d";document.getElementById("a1").style.color="white";}
						if(which==2){document.getElementById("data").placeholder="要复制的内容";operation="COPY";document.getElementById("a2").style.backgroundColor="#6c757d";}document.getElementById("a2").style.color="white";}
						if(which==3){document.getElementById("data").placeholder="要打开的网址";operation="OPEN";document.getElementById("a3").style.backgroundColor="#6c757d";}document.getElementById("a3").style.color="white";}
						if(which==4){document.getElementById("data").placeholder="动作具体参数";document.getElementById("actionID").style.display="block";operation="ACTION";document.getElementById("a4").style.backgroundColor="#6c757d";document.getElementById("a4").style.color="white";}
						
					}
				</script>
			</div>
			<div id="fordata">
				<input type="text" id="actionID" placeholder="动作名称/ID" style="display: none;">
				<textarea rows="8" id="data" class="form-control" placeholder="要粘贴的内容"></textarea>
			</div>
			<div id="forbtn">
				<a class="btn a" onclick="choice_btn(1)" style="margin-left:0px;">粘贴</a>
				<a class="btn a" onclick="choice_btn(2)" >发送</a>
				<a class="btn a" onclick="choice_btn(3)" >清除</a>
				<script>
					function choice_btn(which){
						if(which==1){
							navigator.clipboard.readText()
								.then(text => {
									document.getElementById("data").value = text;
								})
								.catch(err => {
									alert('获取剪贴板内容失败：\n' + err.message);
								});
						}
						if(which==2){
							var requestBody = {
								toUser: document.getElementById('email').value,
								code: document.getElementById('code').value,
								toDevice: document.getElementById('toDevice').value,
								operation: operation,
								data: encodeURIComponent(document.getElementById("data").value),
								action: operation=="ACTION"?document.getElementById('actionID').value:"",
								wait: document.getElementById('chkWait').checked,
								maxWaitMs: document.getElementById('chkWait').checked?document.getElementById('wait').value:0,
								txt: document.getElementById('txt').checked
							};
							fetch('https://push.getquicker.cn/to/quicker', {
								method: 'POST',
								headers: {
									'Content-Type': 'application/json'
								},
								body: JSON.stringify(requestBody)
							}).then(function(response) {
								if(requestBody.txt){
							        return response.text().then(text =>{
							            return { isText: true, content: text };
							        });
							    }else{
							        return response.json().then(json =>{
							            return{ isText: false, content: json };
							        });
							    }
								return response.json();
							}).then(data => {
								if(data.isText){
							        document.getElementById('backdate').textContent = data.content;
							        if (data.content.includes("ERROR:")) {
							            document.getElementById('content').style = "border-color: #ff0000 !important";
							        } else {
							            document.getElementById('content').style = "border-color: #00ff00 !important";
							        }
							    }else{
									document.getElementById('backdate').textContent = JSON.stringify(data.content, null, 4);
									if(data.content.isSuccess==false){
										document.getElementById('content').style="border-color: #ff0000 !important";
									}else{
										document.getElementById('content').style="border-color: #00ff00 !important";
									}
								}
							}).catch(function(error) {
								document.getElementById("backdate").innerText=error;
								document.getElementById('content').style="border-color: #ff0000 !important";
							});
						}
						if(which==3){
							document.getElementById("backdate").innerText = "";
						}
					}
				</script>
			</div>
			<div id="content">
				<pre id="backdate"></pre>
			</div>
		</div>
		<script>
			window.onload = function() {
				choice_operation(1);
			};
		</script>
	</body>
</html>
